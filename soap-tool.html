<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzerothCore SOAP 管理工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            color: #f0e6d0;
        }

        .sidebar {
            width: 260px;
            background: rgba(20, 25, 45, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .sidebar-header h2 {
            font-size: 18px;
            color: #f0e6d0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header .sub {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 4px;
        }

        .sidebar-commands {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0;
        }

        .command-category {
            margin-bottom: 4px;
        }

        .category-header {
            padding: 8px 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: color 0.2s;
            user-select: none;
        }

        .category-header:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .category-header .arrow {
            transition: transform 0.3s;
            font-size: 10px;
        }

        .category-header .arrow.collapsed {
            transform: rotate(-90deg);
        }

        .category-commands {
            overflow: hidden;
            transition: max-height 0.3s ease;
            max-height: 2000px;
        }

        .category-commands.collapsed {
            max-height: 0 !important;
        }

        .command-item {
            padding: 5px 20px 5px 32px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Courier New', monospace;
            border-left: 2px solid transparent;
        }

        .command-item:hover {
            background: rgba(108, 92, 231, 0.1);
            color: #a29bfe;
            border-left-color: #6c5ce7;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }

        .sidebar-footer .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .sidebar-footer .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .sidebar-footer .dot.online {
            background: #00e676;
            box-shadow: 0 0 10px rgba(0, 230, 118, 0.3);
        }

        .sidebar-footer .dot.offline {
            background: #ff5252;
            box-shadow: 0 0 10px rgba(255, 82, 82, 0.3);
        }

        .sidebar-footer .dot.connecting {
            background: #ffc107;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }

        .main-content {
            flex: 1;
            padding: 30px 40px;
            overflow-y: auto;
            max-height: 100vh;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .main-header h1 {
            font-size: 26px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .main-header h1 small {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .lang-selector {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 14px;
            color: #f0e6d0;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
            min-width: 140px;
        }

        .lang-selector:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .lang-selector option {
            background: #1a1f35;
            color: #f0e6d0;
        }

        .config-toggle-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px 18px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .config-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .config-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            display: none;
        }

        .config-panel.open {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .config-panel .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 12px;
        }

        .config-panel .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .config-panel .form-group label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .config-panel .form-group input {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f0e6d0;
            font-size: 14px;
            transition: all 0.3s;
        }

        .config-panel .form-group input:focus {
            outline: none;
            border-color: #6c5ce7;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .config-panel .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .config-panel .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(108, 92, 231, 0.35);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-success {
            background: linear-gradient(135deg, #00b894, #00e676);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.25);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 184, 148, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .command-area {
            margin-bottom: 20px;
        }

        .command-input-group {
            display: flex;
            gap: 12px;
        }

        .command-input-group input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 16px;
            color: #f0e6d0;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        .command-input-group input:focus {
            outline: none;
            border-color: #6c5ce7;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
        }

        .command-input-group input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .command-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }

        .command-toolbar {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .command-toolbar .hint {
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }

        .output-section {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 16px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .output-section pre {
            color: #b8c7d9;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
        }

        .output-section .status {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status.success {
            background: rgba(0, 230, 118, 0.15);
            color: #00e676;
        }
        .status.error {
            background: rgba(255, 82, 82, 0.15);
            color: #ff5252;
        }
        .status.info {
            background: rgba(100, 181, 246, 0.15);
            color: #64b5f6;
        }
        .status.pending {
            background: rgba(255, 193, 7, 0.15);
            color: #ffc107;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .status.warning {
            background: rgba(255, 152, 0, 0.15);
            color: #ffa726;
        }

        .output-empty {
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            text-align: center;
            padding: 50px 0;
        }

        .loading-spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6c5ce7;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .loading-spinner.active {
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .sidebar::-webkit-scrollbar,
        .output-section::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar::-webkit-scrollbar-track,
        .output-section::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar::-webkit-scrollbar-thumb,
        .output-section::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 1000;
                transform: translateX(-100%);
                width: 300px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.5);
                z-index: 999;
            }

            .sidebar-overlay.open {
                display: block;
            }

            .main-content {
                padding: 20px;
                max-height: none;
            }

            .main-header h1 {
                font-size: 20px;
            }

            .main-header h1 small {
                display: block;
                margin-left: 0;
                margin-top: 4px;
            }

            .config-panel .form-row {
                grid-template-columns: 1fr;
            }

            .command-input-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .hamburger {
                display: flex !important;
            }

            .header-controls {
                width: 100%;
            }

            .lang-selector {
                flex: 1;
                min-width: 100px;
            }
        }

        .hamburger {
            display: none;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 8px 12px;
            color: #f0e6d0;
            cursor: pointer;
            font-size: 20px;
        }

        .command-count {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 10px;
            border-radius: 12px;
        }

        .clickable-command {
            color: #a29bfe;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 2px;
            transition: all 0.2s;
        }

        .clickable-command:hover {
            color: #6c5ce7;
            text-decoration-style: solid;
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>⚔️ <span data-lang="nav_title">命令导航</span></h2>
            <div class="sub" data-lang="nav_sub">点击命令自动填充</div>
        </div>
        <div class="sidebar-commands" id="commandList">
            <div style="padding: 20px; text-align: center; color: rgba(255,255,255,0.3); font-size: 13px;">
                <div style="font-size: 32px; margin-bottom: 12px;">📡</div>
                <span data-lang="nav_empty">连接服务器后自动加载</span>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="status">
                <span class="dot offline" id="sidebarDot"></span>
                <span id="sidebarStatus" data-lang="status_disconnected">未连接</span>
                <span style="flex:1"></span>
                <span class="command-count" id="cmdCount">0 <span data-lang="cmd_count">个命令</span></span>
            </div>
        </div>
    </nav>

    <div class="main-content">
        <div class="main-header">
            <div style="display: flex; align-items: center; gap: 16px;">
                <button class="hamburger" id="hamburgerBtn">☰</button>
                <h1>
                    ⚔️ AzerothCore SOAP
                    <small data-lang="header_sub">GM 管理工具</small>
                </h1>
            </div>
            <div class="header-controls">
                <select class="lang-selector" id="langSelector">
                    <option value="zh-CN">🌏 中文</option>
                    <option value="en">🌏 English</option>
                    <option value="es">🌏 Español</option>
                    <option value="fr">🌏 Français</option>
                    <option value="de">🌏 Deutsch</option>
                    <option value="ja">🌏 日本語</option>
                    <option value="ko">🌏 한국어</option>
                    <option value="ru">🌏 Русский</option>
                    <option value="pt">🌏 Português</option>
                    <option value="it">🌏 Italiano</option>
                    <option value="ar">🌏 العربية</option>
                    <option value="hi">🌏 हिन्दी</option>
                </select>
                <button class="config-toggle-btn" id="configToggleBtn">
                    ⚙️ <span data-lang="config_show">显示配置</span>
                </button>
            </div>
        </div>

        <div class="config-panel" id="configPanel">
            <div class="form-row">
                <div class="form-group">
                    <label data-lang="config_host">服务器地址</label>
                    <input type="text" id="serverHost" value="127.0.0.1" placeholder="127.0.0.1">
                </div>
                <div class="form-group">
                    <label data-lang="config_port">SOAP 端口</label>
                    <input type="number" id="serverPort" value="7878" placeholder="7878">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label data-lang="config_username">GM 用户名</label>
                    <input type="text" id="gmUsername" placeholder="admin">
                </div>
                <div class="form-group">
                    <label data-lang="config_password">GM 密码</label>
                    <input type="password" id="gmPassword" placeholder="••••••••">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="connectBtn">
                    <span class="loading-spinner" id="connectSpinner"></span>
                    <span id="connectBtnText" data-lang="btn_connect">🔗 连接服务器</span>
                </button>
                <button class="btn btn-secondary" id="saveConfigBtn" data-lang="btn_save">💾 保存配置</button>
            </div>
        </div>

        <div class="command-area">
            <div class="command-input-group">
                <input type="text" id="commandInput" placeholder="输入 GM 命令..." disabled />
                <button class="btn btn-success" id="executeBtn" disabled>
                    <span class="loading-spinner" id="executeSpinner"></span>
                    <span id="executeBtnText" data-lang="btn_execute">执行</span>
                </button>
            </div>
            <div class="command-toolbar">
                <button class="btn btn-secondary" id="clearBtn" style="padding: 6px 16px; font-size: 12px;" data-lang="btn_clear">
                    🗑️ 清空输出
                </button>
                <span class="hint" data-lang="hint_click">💡 点击带下划线的命令自动填充</span>
            </div>
        </div>

        <div class="output-section" id="outputArea">
            <div class="output-empty">
                <span data-lang="output_empty">💡 连接服务器后自动加载命令列表</span>
            </div>
        </div>
    </div>

            // ============================================================

            function logOutput(message, type = 'info', clickableCommands = null) {
                // 清空输出（不保留历史）
                outputArea.innerHTML = '';

                const entry = document.createElement('div');
                entry.style.marginBottom = '10px';

                const status = document.createElement('span');
                status.className = 'status ' + type;
                const labels = {
                    info: t('log_info'),
                    success: t('log_success'),
                    error: t('log_error'),
                    pending: t('log_pending'),
                    warning: t('log_warning')
                };
                status.textContent = labels[type] || t('log_info');

                const pre = document.createElement('pre');

                if (clickableCommands && clickableCommands.length > 0) {
                    let html = message;
                    for (const cmd of clickableCommands) {
                        const escaped = cmd.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                        const regex = new RegExp('(\\b' + escaped + '\\b)', 'g');
                        html = html.replace(regex, '<span class="clickable-command" data-cmd="$1">$1</span>');
                    }
                    pre.innerHTML = html;
                } else {
                    pre.textContent = message;
                }

                entry.appendChild(status);
                entry.appendChild(pre);
                outputArea.appendChild(entry);
                outputArea.scrollTop = outputArea.scrollHeight;

                // 为可点击命令绑定事件
                if (clickableCommands && clickableCommands.length > 0) {
                    const clickables = entry.querySelectorAll('.clickable-command');
                    clickables.forEach(el => {
                        el.addEventListener('click', function() {
                            const cmd = this.dataset.cmd;
                            fillAndExecute(cmd);
                        });
                    });
                }
            }

            // ============================================================
            // SOAP 核心
            // ============================================================
            function buildSOAPRequest(command) {
                if (!command.startsWith('.')) command = '.' + command;
                return '<?xml version="1.0" encoding="UTF-8"?>\n' +
                    '<SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ns1="urn:AC">\n' +
                    '    <SOAP-ENV:Body>\n' +
                    '        <ns1:executeCommand>\n' +
                    '            <command>' + command + '</command>\n' +
                    '        </ns1:executeCommand>\n' +
                    '    </SOAP-ENV:Body>\n' +
                    '</SOAP-ENV:Envelope>';
            }

            function extractSOAPContent(xml) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(xml, 'text/xml');

                const faultString = doc.querySelector('faultstring');
                if (faultString) {
                    return faultString.textContent.trim();
                }

                const detail = doc.querySelector('detail');
                if (detail) {
                    return detail.textContent.trim();
                }

                const result = doc.querySelector('result');
                if (result) {
                    return result.textContent.trim();
                }

                return xml;
            }

            async function executeSOAPCommand(command) {
                const host = serverHost.value || '127.0.0.1';
                const port = parseInt(serverPort.value) || 7878;
                const username = gmUsername.value;
                const password = gmPassword.value;

                if (!username || !password) throw new Error(t('msg_connect_first'));
                if (!command || command.trim() === '') throw new Error(t('msg_enter_command'));

                const soapXML = buildSOAPRequest(command.trim());
                const url = 'http://' + host + ':' + port + '/';

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/xml',
                        'Authorization': 'Basic ' + btoa(username + ':' + password)
                    },
                    body: soapXML
                });

                const responseText = await response.text();
                const content = extractSOAPContent(responseText);

                if (content && content.length > 0) {
                    return {
                        status: response.status,
                        content: content,
                        raw: responseText,
                        isError: response.status >= 400
                    };
                }

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                }

                return {
                    status: response.status,
                    content: content || '命令执行成功',
                    raw: responseText,
                    isError: false
                };
            }

            // ============================================================
            // 命令解析
            // ============================================================
            function extractAllCommands(text) {
                const commands = [];
                const lines = text.split('\n');

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    let match = trimmed.match(/^[\|\-]+\s*([a-zA-Z0-9_]+\s+[a-zA-Z0-9_]+)/);
                    if (match) {
                        commands.push(match[1]);
                        continue;
                    }

                    match = trimmed.match(/^[\|\-]+\s*([a-zA-Z0-9_]+)/);
                    if (match) {
                        commands.push(match[1]);
                        continue;
                    }

                    const simpleMatch = trimmed.match(/^([a-zA-Z0-9_]+\s+[a-zA-Z0-9_]+)\s*/);
                    if (simpleMatch) {
                        const name = simpleMatch[1];
                        const exclude = ['Syntax', 'USAGE', 'Possible', 'subcommands', '可以使用', 'Display', 'usage',
                            'instructions', 'command', 'provided', 'available', 'commands', '###'
                        ];
                        if (!exclude.includes(name.split(' ')[0]) && name.length > 2) {
                            commands.push(name);
                        }
                        continue;
                    }

                    const simpleMatch2 = trimmed.match(/^([a-zA-Z0-9_]+)\s*/);
                    if (simpleMatch2) {
                        const name = simpleMatch2[1];
                        const exclude = ['Syntax', 'USAGE', 'Possible', 'subcommands', '可以使用', 'Display', 'usage',
                            'instructions', 'command', 'provided', 'available', 'commands', '###'
                        ];
                        if (!exclude.includes(name) && name.length > 1) {
                            commands.push(name);
                        }
                    }
                }

                return [...new Set(commands)];
            }

            function extractMainCommands(text) {
                const commands = [];
                const lines = text.split('\n');

                for (const line of lines) {
                    const trimmed = line.trim();
                    if (!trimmed) continue;

                    let match = trimmed.match(/^[\|\-]+\s*([a-zA-Z0-9_]+)/);
                    if (match) {
                        const name = match[1];
                        commands.push(name);
                        continue;
                    }

                    const simpleMatch = trimmed.match(/^([a-zA-Z0-9_]+)\s*/);
                    if (simpleMatch) {
                        const name = simpleMatch[1];
                        const exclude = ['Syntax', 'USAGE', 'Possible', 'subcommands', '可以使用', 'Display', 'usage',
                            'instructions', 'command', 'provided', 'available', 'commands', '###'
                        ];
                        if (!exclude.includes(name) && name.length > 1) {
                            commands.push(name);
                        }
                    }
                }

                return [...new Set(commands)];
            }

            function categorizeCommands(commands) {
                const categories = {};

                for (const name of commands) {
                    let category = '其他';
                    const n = name;
                    if (n.startsWith('server')) category = '服务器管理';
                    else if (n.startsWith('player') || n.startsWith('character') || n.startsWith('pinfo')) category =
                        '玩家管理';
                    else if (n.startsWith('tele') || n.startsWith('go') || n.startsWith('worldport')) category = '传送';
                    else if (n.startsWith('npc') || n.startsWith('creature') || n.startsWith('bot')) category =
                        'NPC/生物管理';
                    else if (n.startsWith('item') || n.startsWith('add') || n.startsWith('lookup')) category = '物品查找';
                    else if (n.startsWith('reload')) category = '重载配置';
                    else if (n.startsWith('announce') || n.startsWith('whisper') || n.startsWith('send') || n.startsWith(
                        'notify')) category = '消息系统';
                    else if (n.startsWith('modify') || n.startsWith('set') || n.startsWith('level') || n.startsWith(
                        'reset')) category = '修改属性';
                    else if (n.startsWith('kick') || n.startsWith('ban') || n.startsWith('unban') || n.startsWith(
                        'mute') || n.startsWith('unmute')) category = '封禁管理';
                    else if (n.startsWith('quest')) category = '任务管理';
                    else if (n.startsWith('group') || n.startsWith('guild')) category = '社交管理';
                    else if (n.startsWith('debug')) category = '调试命令';
                    else if (n.startsWith('account') || n.startsWith('password')) category = '账号管理';
                    else if (n.startsWith('help') || n.startsWith('commands')) category = '帮助';
                    else if (n.startsWith('list') || n.startsWith('lookup')) category = '查找列表';
                    else if (n.startsWith('ticket')) category = '工单管理';
                    else if (n.startsWith('instance') || n.startsWith('arena') || n.startsWith('lfg')) category =
                        '副本竞技场';
                    else if (n.startsWith('save') || n.startsWith('flush')) category = '数据保存';
                    else if (n.startsWith('achievement')) category = '成就';
                    else if (n.startsWith('deserter')) category = '惩罚管理';
                    else if (n.startsWith('pdump')) category = '玩家数据';
                    else if (n.startsWith('worldstate')) category = '世界状态';
                    else if (n.startsWith('combatstop') || n.startsWith('revive') || n.startsWith('unstuck')) category =
                        '战斗复活';
                    else if (n.startsWith('event')) category = '事件管理';
                    else if (n.startsWith('disable')) category = '禁用管理';
                    else if (n.startsWith('cache')) category = '缓存管理';
                    else if (n.startsWith('gm')) category = 'GM管理';

                    if (!categories[category]) categories[category] = [];
                    categories[category].push('.' + n);
                }

                return categories;
            }

            // ============================================================
            // 渲染导航栏
            // ============================================================
            function renderCommands(categories) {
                commandList.innerHTML = '';
                let total = 0;

                if (!categories || Object.keys(categories).length === 0) {
                    commandList.innerHTML =
                        '<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.3);font-size:13px;">' +
                        '<div style="font-size:32px;margin-bottom:12px;">📭</div>' +
                        '<span data-lang="nav_empty">' + t('nav_empty') + '</span></div>';
                    cmdCount.textContent = '0 ' + t('cmd_count');
                    return;
                }

                const sortedCategories = Object.keys(categories).sort();

                for (const categoryName of sortedCategories) {
                    const commands = categories[categoryName];
                    if (!commands || commands.length === 0) continue;

                    total += commands.length;

                    const categoryDiv = document.createElement('div');
                    categoryDiv.className = 'command-category';

                    const header = document.createElement('div');
                    header.className = 'category-header';
                    header.innerHTML = categoryName +
                        ' <span style="display:flex;align-items:center;gap:8px;">' +
                        '<span style="font-size:10px;color:rgba(255,255,255,0.2);">' + commands.length + '</span>' +
                        '<span class="arrow">▼</span></span>';

                    const commandsContainer = document.createElement('div');
                    commandsContainer.className = 'category-commands';

                    const index = sortedCategories.indexOf(categoryName);
                    if (index >= 3) {
                        commandsContainer.classList.add('collapsed');
                        header.querySelector('.arrow').classList.add('collapsed');
                    }

                    header.addEventListener('click', function() {
                        const isCollapsed = commandsContainer.classList.toggle('collapsed');
                        header.querySelector('.arrow').classList.toggle('collapsed', isCollapsed);
                    });

                    for (const cmd of commands) {
                        const item = document.createElement('div');
                        item.className = 'command-item';
                        item.textContent = cmd;

                        item.addEventListener('click', function() {
                            fillAndExecute(cmd);
                        });

                        commandsContainer.appendChild(item);
                    }

                    categoryDiv.appendChild(header);
                    categoryDiv.appendChild(commandsContainer);
                    commandList.appendChild(categoryDiv);
                }

                cmdCount.textContent = total + ' ' + t('cmd_count');
            }

            // ============================================================
            // 连接服务器
            // ============================================================
            async function handleConnect() {
                saveConfig();

                connectBtn.disabled = true;
                connectSpinner.classList.add('active');
                connectBtnText.textContent = t('btn_connecting');
                sidebarDot.className = 'dot connecting';
                sidebarStatus.textContent = t('status_connecting');

                logOutput(t('msg_connecting'), 'pending');

                try {
                    const result = await executeSOAPCommand('help');

                    isConnected = true;
                    sidebarDot.className = 'dot online';
                    sidebarStatus.textContent = t('status_connected');
                    connectBtnText.textContent = t('btn_connected');
                    connectBtn.className = 'btn btn-success';

                    commandInput.disabled = false;
                    executeBtn.disabled = false;

                    const allCmds = extractAllCommands(result.content);
                    const mainCmds = extractMainCommands(result.content);

                    if (result.isError) {
                        logOutput(t('msg_server_error').replace('{status}', result.status), 'warning');
                    } else {
                        logOutput(t('msg_connected'), 'success');
                    }

                    const clickableCmds = allCmds.filter(c => c.length > 1);
                    logOutput('📖 ' + result.content, 'info', clickableCmds);

                    if (clickableCmds.length > 0) {
                        logOutput(t('msg_fill_hint'), 'info');
                    }

                    if (mainCmds.length > 0) {
                        const categories = categorizeCommands(mainCmds);
                        renderCommands(categories);
                        logOutput(t('msg_loaded_commands').replace('{count}', mainCmds.length), 'success');
                    } else {
                        logOutput(t('msg_no_commands'), 'warning');
                    }

                    commandInput.value = '.help';

                } catch (error) {
                    isConnected = false;
                    sidebarDot.className = 'dot offline';
                    sidebarStatus.textContent = t('status_failed');
                    connectBtnText.textContent = t('btn_connect');
                    connectBtn.className = 'btn btn-primary';
                    commandInput.disabled = true;
                    executeBtn.disabled = true;

                    logOutput('❌ ' + error.message, 'error');

                    if (error.message.includes('401')) {
                        logOutput(t('msg_auth_error'), 'info');
                    } else if (error.message.includes('ECONNREFUSED') || error.message.includes('fetch')) {
                        logOutput(t('msg_connection_error'), 'info');
                    }
                } finally {
                    connectBtn.disabled = false;
                    connectSpinner.classList.remove('active');
                }
            }

            // ============================================================
            // 执行命令
            // ============================================================
            async function handleExecuteCommand() {
                const command = commandInput.value.trim();
                if (!command) {
                    logOutput(t('msg_enter_command'), 'error');
                    return;
                }

                if (!isConnected) {
                    logOutput(t('msg_connect_first'), 'error');
                    return;
                }

                executeBtn.disabled = true;
                executeSpinner.classList.add('active');
                executeBtnText.textContent = t('btn_executing');

                logOutput(t('msg_executing') + command, 'pending');

                try {
                    const result = await executeSOAPCommand(command);

                    const cmds = extractAllCommands(result.content);

                    if (result.isError) {
                        logOutput(t('msg_server_error').replace('{status}', result.status), 'warning');
                    }

                    const clickableCmds = cmds.filter(c => c.length > 1);
                    logOutput(result.content, result.isError ? 'warning' : 'success', clickableCmds);

                    if (clickableCmds.length > 0) {
                        logOutput(t('msg_fill_hint'), 'info');
                    }

                } catch (error) {
                    logOutput('❌ ' + error.message, 'error');
                    if (error.message.includes('401') || error.message.includes('ECONNREFUSED')) {
                        isConnected = false;
                        sidebarDot.className = 'dot offline';
                        sidebarStatus.textContent = t('status_disconnected_short');
                        connectBtnText.textContent = t('btn_reconnect');
                        connectBtn.className = 'btn btn-primary';
                        commandInput.disabled = true;
                        executeBtn.disabled = true;
                        logOutput(t('msg_disconnected'), 'error');
                    }
                } finally {
                    executeBtn.disabled = false;
                    executeSpinner.classList.remove('active');
                    executeBtnText.textContent = t('btn_execute');
                }
            }

            // ============================================================
            // 键盘事件
            // ============================================================
            commandInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey && !commandInput.disabled) {
                    e.preventDefault();
                    handleExecuteCommand();
                }
            });

            // ============================================================
            // 按钮事件
            // ============================================================
            connectBtn.addEventListener('click', handleConnect);
            executeBtn.addEventListener('click', handleExecuteCommand);
            clearBtn.addEventListener('click', clearOutput);
            saveConfigBtn.addEventListener('click', saveConfig);

            [serverHost, serverPort, gmUsername, gmPassword].forEach(el => {
                el.addEventListener('change', saveConfig);
                el.addEventListener('input', saveConfig);
            });

            // ============================================================
            // 初始化
            // ============================================================
            loadConfig();
            updateUI();

            sidebarDot.className = 'dot offline';
            sidebarStatus.textContent = t('status_disconnected');
            commandInput.disabled = true;
            executeBtn.disabled = true;

            if (gmUsername.value && gmPassword.value) {
                logOutput(t('msg_config_loaded'), 'info');
            } else {
                logOutput(t('msg_config_prompt'), 'info');
            }

        })();
    </script>
</body>
</html>
