acing:.3px}.config-panel .form-group input{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px 14px;color:#f0e6d0;font-size:14px;transition:all .3s}.config-panel .form-group input:focus{outline:none;border-color:#6c5ce7;background:rgba(255,255,255,0.1);box-shadow:0 0 0 3px rgba(108,92,231,0.1)}.config-panel .form-group input::placeholder{color:rgba(255,255,255,0.2)}.config-panel .form-actions{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}.btn{padding:10px 24px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s;display:inline-flex;align-items:center;gap:8px}.btn-primary{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;box-shadow:0 4px 15px rgba(108,92,231,0.25)}.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(108,92,231,0.35)}.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none!important}.btn-success{background:linear-gradient(135deg,#00b894,#00e676);color:#fff;box-shadow:0 4px 15px rgba(0,184,148,0.25)}.btn-success:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(0,184,148,0.35)}.btn-secondary{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.08)}.btn-secondary:hover{background:rgba(255,255,255,0.1)}.command-area{margin-bottom:20px}.command-input-group{display:flex;gap:12px}.command-input-group input{flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 16px;color:#f0e6d0;font-size:14px;font-family:'Courier New',monospace;transition:all .3s}.command-input-group input:focus{outline:none;border-color:#6c5ce7;background:rgba(255,255,255,0.1);box-shadow:0 0 0 3px rgba(108,92,231,0.1)}.command-input-group input:disabled{opacity:.4;cursor:not-allowed}.command-input-group input::placeholder{color:rgba(255,255,255,0.2)}.command-toolbar{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}. <body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<nav class="sidebar" id="sidebar">
<div class="sidebar-header"><h2>⚔️ <span data-lang="nav_title">命令导航</span></h2><div class="sub" data-lang="nav_sub">点击命令自动填充</div></div>
<div class="sidebar-commands" id="commandList"><div style="padding:20px;text-align:center;color:rgba(255,255,255,0.3);font-size:13px;"><div style="font-size:32px;margin-bottom:12px;">📡</div><span data-lang="nav_empty">连接服务器后自动加载</span></div></div>
<div class="sidebar-footer"><div class="status"><span class="dot offline" id="sidebarDot"></span><span id="sidebarStatus" data-lang="status_disconnected">未连接</span><span style="flex:1"></span><span class="command-count" id="cmdCount">0 <span data-lang="cmd_count">个命令</span></span></div></div>
</nav>
<div class="main-content">
<div class="main-header">
<div style="display:flex;align-items:center;gap:16px;"><button class="hamburger" id="hamburgerBtn">☰</button><h1>⚔️ AzerothCore SOAP <small data-lang="header_sub">GM 管理工具</small></h1></div>
<div class="header-controls">
<select class="lang-selector" id="langSelector">
<option value="zh-CN">🌏 中文</option><option value="en">🌏 English</option><option value="es">🌏 Español</option><option value="fr">🌏 Français</option><option value="de">🌏 Deutsch</option><option value="ja">🌏 日本語</option><option value="ko">🌏 한국어</option><option value="ru">🌏 Русский</option><option value="pt">🌏 Português</option><option value="it">🌏 Italiano</option><option value="ar">🌏 العربية</option><option value="hi">🌏 हिन्दी</option>
</select>
<button class="config-toggle-btn" id="configToggleBtn">⚙️ <span data-lang="config_show">显示配置</span></button>
</div></div>
<div class="config-panel" id="configPanel">
<div class="form-row"><div class="form-group"><label data-lang="config_host">服务器地址</label><input type="text" id="serverHost" value="127.0.0.1" placeholder="127.0.0.1"></div><div class="form-group"><label data-lang="config_port">SOAP 端口</label><input type="number" id="serverPort" value="7878" placeholder="7878"></div></div>
<div class="form-row"><div class="form-group"><label data-lang="config_username">GM 用户名</label><input type="text" id="gmUsername" placeholder="admin"></div><div class="form-group"><label data-lang="config_password">GM 密码</label><input type="password" id="gmPassword" placeholder="••••••••"></div></div>
<div class="form-actions"><button class="btn btn-primary" id="connectBtn"><span class="loading-spinner" id="connectSpinner"></span><span id="connectBtnText" data-lang="btn_connect">🔗 连接服务器</span></button><button class="btn btn-secondary" id="saveConfigBtn" data-lang="btn_save">💾 保存配置</button></div>
</div>
<div class="command-area">
<div class="command-input-group"><input type="text" id="commandInput" placeholder="输入 GM 命令..." disabled /><button class="btn btn-success" id="executeBtn" disabled><span class="loading-spinner" id="executeSpinner"></span><span id="executeBtnText" data-lang="btn_execute">执行</span></button></div>
<div class="command-toolbar"><button class="btn btn-secondary" id="clearBtn" style="padding:6px 16px;font-size:12px;" data-lang="btn_clear">🗑️ 清空输出</button><span class="hint" data-lang="hint_click">💡 点击带下划线的命令自动填充</span></div>
</div>
<div class="output-section" id="outputArea"><div class="output-empty"><span data-lang="output_empty">💡 连接服务器后自动加载命令列表</span></div></div>
</div>

let lang='zh-CN';
const H=document.getElementById('serverHost'),P=document.getElementById('serverPort'),U=document.getElementById('gmUsername'),PW=document.getElementById('gmPassword'),CB=document.getElementById('connectBtn'),CS=document.getElementById('connectSpinner'),CBT=document.getElementById('connectBtnText'),CTB=document.getElementById('configToggleBtn'),CP=document.getElementById('configPanel'),CI=document.getElementById('commandInput'),EB=document.getElementById('executeBtn'),ES=document.getElementById('executeSpinner'),EBT=document.getElementById('executeBtnText'),OA=document.getElementById('outputArea'),CLB=document.getElementById('clearBtn'),CL=document.getElementById('commandList'),SD=document.getElementById('sidebarDot'),SS=document.getElementById('sidebarStatus'),CC=document.getElementById('cmdCount'),HB=document.getElementById('hamburgerBtn'),SO=document.getElementById('sidebarOverlay'),SB=document.getElementById('sidebar'),SV=document.getElementById('saveConfigBtn'),LS=document.getElementById('langSelector');
let conn=false;
function t(k){const d=L[lang]||L['zh-CN'];return d[k]||k}
function updUI(){document.querySelectorAll('[data-lang]').forEach(el=>{const k=el.dataset.lang,txt=t(k);if(txt){const ic=el.querySelector('span, .emoji');if(ic){el.textContent=txt;el.prepend(ic)}else el.textContent=txt}});if(conn)CBT.textContent=t('btn_connected');else if(CB.disabled)CBT.textContent=t('btn_connecting');else CBT.textContent=t('btn_connect');const op=CP.classList.contains('open');CTB.querySelector('span').textContent=op?t('config_hide'):t('config_show');if(EB.disabled)EBT.textContent=t('btn_executing');else EBT.textContent=t('btn_execute');if(conn)SS.textContent=t('status_connected');else if(SS.textContent.includes('...'))SS.textContent=t('status_connecting');else SS.textContent=t('status_disconnected');const ct=CC.textContent;if(ct.includes(' ')){const n=ct.split(' ')[0];CC.textContent=n+' '+t('cmd_count')}}
function loadCfg(){try{const s=localStorage.getItem('azeroth_soap_config');if(s){const c=JSON.parse(s);if(c.host)H.value=c.host;if(c.port)P.value=c.port;if(c.username)U.value=c.username;if(c.password)PW.value=c.password;if(c.lang){lang=c.lang;LS.value=c.lang;updUI()}}}catch(e){}}
function saveCfg(){try{const c={host:H.value||'127.0.0.1',port:P.value||'7878',username:U.value||'',password:PW.value||'',lang:lang};localStorage.setItem('azeroth_soap_config',JSON.stringify(c));log(t('msg_saved'),'success')}catch(e){log(t('msg_save_failed')+e.message,'error')}}
let cfgOpen=false;CTB.onclick=function(){cfgOpen=!cfgOpen;CP.classList.toggle('open',cfgOpen);CTB.querySelector('span').textContent=cfgOpen?t('config_hide'):t('config_show');try{localStorage.setItem('config_panel_open',JSON.stringify(cfgOpen))}catch(e){}};try{const s=localStorage.getItem('config_panel_open');if(s!==null&&JSON.parse(s)){cfgOpen=true;CP.classList.add('open');CTB.querySelector('span').textContent=t('config_hide')}}catch(e){}
HB.onclick=function(){SB.classList.toggle('open');SO.classList.toggle('open')};SO.onclick=function(){SB.classList.remove('open');SO.classList.remove('open')};
function log(msg,type='info',cmds=null){OA.innerHTML='';const e=document.createElement('div');e.style.marginBottom='10px';const s=document.createElement('span');s.className='status '+type;const lb={info:t('log_info'),success:t('log_success'),error:t('log_error'),pending:t('log_pending'),warning:t('log_warning')};s.textContent=lb[type]||t('log_info');const p=document.createElement('pre');if(cmds&&cmds.length>0){let html=msg;for(const c of cmds){const esc=c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');const rg=new RegExp('(\\b'+esc+'\\b)','g');html=html.replace(rg,'<span class="clickable-command" data-cmd="$1">$1</span>')}p.innerHTML=html}else p.textContent=msg;e.appendChild(s);e.appendChild(p);OA.appendChild(e);OA.scrollTop=OA.scrollHeight;if(cmds&&cmds.length>0){const clks=e.querySelectorAll('.clickable-command');clks.forEach(el=>{el.onclick=function(){const c=this.dataset.cmd;fillExec(c)}})}}
function clearOut(){OA.innerHTML='<div class="output-empty"><span data-lang="output_empty">'+t('output_empty')+'</span></div>'}
function fillExec(cmd){CI.value=cmd;if(conn)EB.click();else log(t('msg_connect_first'),'error')}
function buildSOAP(cmd){if(!cmd.startsWith('.'))cmd='.'+cmd;return'<?xml version="1.0" encoding="UTF-8"?>\n<SOAP-ENV:Envelope xmlns:SOAP-ENV="http://schemas.xmlsoap.org/soap/envelope/" xmlns:ns1="urn:AC">\n<SOAP-ENV:Body>\n<ns1:executeCommand>\n<command>'+cmd+'</command>\n</ns1:executeCommand>\n</SOAP-ENV:Body>\n</SOAP-ENV:Envelope>'}
function extractSOAP(xml){const p=new DOMParser(),d=p.parseFromString(xml,'text/xml');const fs=d.querySelector('faultstring');if(fs)return fs.textContent.trim();const dt=d.querySelector('detail');if(dt)return dt.textContent.trim();const rs=d.querySelector('result');if(rs)return rs.textContent.trim();return xml}
async function execSOAP(cmd){const host=H.value||'127.0.0.1',port=parseInt(P.value)||7878,user=U.value,pw=PW.value;if(!user||!pw)throw new Error(t('msg_connect_first'));if(!cmd||cmd.trim()==='')throw new Error(t('msg_enter_command'));const xml=buildSOAP(cmd.trim()),url='http://'+host+':'+port+'/';const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/xml','Authorization':'Basic '+btoa(user+':'+pw)},body:xml});const txt=await r.text(),cnt=extractSOAP(txt);if(cnt&&cnt.length>0)return{status:r.status,content:cnt,raw:txt,isError:r.status>=400};if(!r.ok)throw new Error('HTTP '+r.status+': '+r.statusText);return{status:r.status,content:cnt||'命令执行成功',raw:txt,isError:false}}
function extractAll(text){const cmds=[];const lines=text.split('\n');for(const line of lines){const t=line.trim();if(!t)continue;let m=t.match(/^[\|\-]+\s*([a-zA-Z0-9_]+\s+[a-zA-Z0-9_]+)/);if(m){cmds.push(m[1]);continue}m=t.match(/^[\|\-]+\s*([a-zA-Z0-9_]+)/);if(m){cmds.push(m[1]);continue}const sm=t.match(/^([a-zA-Z0-9_]+\s+[a-zA-Z0-9_]+)\s*/);if(sm){const n=sm[1],ex=['Syntax','USAGE','Possible','subcommands','可以使用','Display','usage','instructions','command','provided','available','commands','###'];if(!ex.includes(n.split(' ')[0])&&n.length>2){cmds.push(n)}continue}const sm2=t.match(/^([a-zA-Z0-9_]+)\s*/);if(sm2){const n=sm2[1],ex=['Syntax','USAGE','Possible','subcommands','可以使用','Display','usage','instructions','command','provided','available','commands','###'];if(!ex.includes(n)&&n.length>1)cmds.push(n)}}return[...new Set(cmds)]}
function extractMain(text){const cmds=[];const lines=text.split('\n');for(const line of lines){const t=line.trim();if(!t)continue;let m=t.match(/^[\|\-]+\s*([a-zA-Z0-9_]+)/);if(m){cmds.push(m[1]);continue}const sm=t.match(/^([a-zA-Z0-9_]+)\s*/);if(sm){const n=sm[1],ex=['Syntax','USAGE','Possible','subcommands','可以使用','Display','usage','instructions','command','provided','available','commands','###'];if(!ex.includes(n)&&n.length>1)cmds.push(n)}}return[...new Set(cmds)]}
function categorize(cmds){const cats={};for(const n of cmds){let cat='其他';if(n.startsWith('server'))cat='服务器管理';else if(n.startsWith('player')||n.startsWith('character')||n.startsWith('pinfo'))cat='玩家管理';else if(n.startsWith('tele')||n.startsWith('go')||n.startsWith('worldport'))cat='传送';else if(n.startsWith('npc')||n.startsWith('creature')||n.startsWith('bot'))cat='NPC/生物管理';else if(n.startsWith('item')||n.startsWith('add')||n.startsWith('lookup'))cat='物品查找';else if(n.startsWith('reload'))cat='重载配置';else if(n.startsWith('announce')||n.startsWith('whisper')||n.startsWith('send')||n.startsWith('notify'))cat='消息系统';else if(n.startsWith('modify')||n.startsWith('set')||n.startsWith('level')||n.startsWith('reset'))cat='修改属性';else if(n.startsWith('kick')||n.startsWith('ban')||n.startsWith('unban')||n.startsWith('mute')||n.startsWith('unmute'))cat='封禁管理';else if(n.startsWith('quest'))cat='任务管理';else if(n.startsWith('group')||n.startsWith('guild'))cat='社交管理';else if(n.startsWith('debug'))cat='调试命令';else if(n.startsWith('account')||n.startsWith('password'))cat='账号管理';else if(n.startsWith('help')||n.startsWith('commands'))cat='帮助';else if(n.startsWith('list')||n.startsWith('lookup'))cat='查找列表';else if(n.startsWith('ticket'))cat='工单管理';else if(n.startsWith('instance')||n.startsWith('arena')||n.startsWith('lfg'))cat='副本竞技场';else if(n.startsWith('save')||n.startsWith('flush'))cat='数据保存';else if(n.startsWith('achievement'))cat='成就';else if(n.startsWith('deserter'))cat='惩罚管理';else if(n.startsWith('pdump'))cat='玩家数据';else if(n.startsWith('worldstate'))cat='世界状态';else if(n.startsWith('combatstop')||n.startsWith('revive')||n.startsWith('unstuck'))cat='战斗复活';else if(n.startsWith('event'))cat='事件管理';else if(n.startsWith('disable'))cat='禁用管理';else if(n.startsWith('cache'))cat='缓存管理';else if(n.startsWith('gm'))cat='GM管理';if(!cats[cat])cats[cat]=[];cats[cat].push('.'+n)}return cats}
function render(cats){CL.innerHTML='';let total=0;if(!cats||Object.keys(cats).length===0){CL.innerHTML='<div style="padding:20px;text-align:center;color:rgba(255,255,255,0.3);font-size:13px;"><div style="font-size:32px;margin-bottom:12px;">📭</div><span data-lang="nav_empty">'+t('nav_empty')+'</span></div>';CC.textContent='0 '+t('cmd_count');return}const sorted=Object.keys(cats).sort();for(const cat of sorted){const cmds=cats[cat];if(!cmds||cmds.length===0)continue;total+=cmds.length;const div=document.createElement('div');div.className='command-category';const hdr=document.createElement('div');hdr.className='category-header';hdr.innerHTML=cat+' <span style="display:flex;align-items:center;gap:8px;"><span style="font-size:10px;color:rgba(255,255,255,0.2);">'+cmds.length+'</span><span class="arrow">▼</span></span>';const cnt=document.createElement('div');cnt.className='category-commands';const idx=sorted.indexOf(cat);if(idx>=3){cnt.classList.add('collapsed');hdr.querySelector('.arrow').classList.add('collapsed')}hdr.onclick=function(){const c=cnt.classList.toggle('collapsed');hdr.querySelector('.arrow').classList.toggle('collapsed',c)};for(const c of cmds){const it=document.createElement('div');it.className='command-item';it.textContent=c;it.onclick=function(){fillExec(c)};cnt.appendChild(it)}div.appendChild(hdr);div.appendChild(cnt);CL.appendChild(div)}CC.textContent=total+' '+t('cmd_count')}
async function handleConnect(){saveCfg();CB.disabled=true;CS.classList.add('active');CBT.textContent=t('btn_connecting');SD.className='dot connecting';SS.textContent=t('status_connecting');log(t('msg_connecting'),'pending');try{const r=await execSOAP('help');conn=true;SD.className='dot online';SS.textContent=t('status_connected');CBT.textContent=t('btn_connected');CB.className='btn btn-success';CI.disabled=false;EB.disabled=false;const all=extractAll(r.content),main=extractMain(r.content);if(r.isError)log(t('msg_server_error').replace('{status}',r.status),'warning');else log(t('msg_connected'),'success');const clk=all.filter(c=>c.length>1);log('📖 '+r.content,'info',clk);if(clk.length>0)log(t('msg_fill_hint'),'info');if(main.length>0){const cats=categorize(main);render(cats);log(t('msg_loaded_commands').replace('{count}',main.length),'success')}else log(t('msg_no_commands'),'warning');CI.value='.help'}catch(e){conn=false;SD.className='dot offline';SS.textContent=t('status_failed');CBT.textContent=t('btn_connect');CB.className='btn btn-primary';CI.disabled=true;EB.disabled=true;log('❌ '+e.message,'error');if(e.message.includes('401'))log(t('msg_auth_error'),'info');else if(e.message.includes('ECONNREFUSED')||e.message.includes('fetch'))log(t('msg_connection_error'),'info')}finally{CB.disabled=false;CS.classList.remove('active')}}
async function handleExec(){const cmd=CI.value.trim();if(!cmd){log(t('msg_enter_command'),'error');return}if(!conn){log(t('msg_connect_first'),'error');return}EB.disabled=true;ES.classList.add('active');EBT.textContent=t('btn_executing');log(t('msg_executing')+cmd,'pending');try{const r=await execSOAP(cmd);const cmds=extractAll(r.content);if(r.isError)log(t('msg_server_error').replace('{status}',r.status),'warning');const clk=cmds.filter(c=>c.length>1);log(r.content,r.isError?'warning':'success',clk);if(clk.length>0)log(t('msg_fill_hint'),'info')}catch(e){log('❌ '+e.message,'error');if(e.message.includes('401')||e.message.includes('ECONNREFUSED')){conn=false;SD.className='dot offline';SS.textContent=t('status_disconnected_short');CBT.textContent=t('btn_reconnect');CB.className='btn btn-primary';CI.disabled=true;EB.disabled=true;log(t('msg_disconnected'),'error')}}finally{EB.disabled=false;ES.classList.remove('active');EBT.textContent=t('btn_execute')}}
CI.onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey&&!CI.disabled){e.preventDefault();handleExec()}};
CB.onclick=handleConnect;EB.onclick=handleExec;CLB.onclick=clearOut;SV.onclick=saveCfg;
[H,P,U,PW].forEach(el=>{el.onchange=saveCfg;el.oninput=saveCfg});
LS.onchange=function(){lang=this.value;updUI();const h=document.querySelector('.command-toolbar .hint');if(h)h.textContent=t('hint_click');const em=OA.querySelector('.output-empty');if(em){const sp=em.querySelector('span');if(sp)sp.textContent=t('output_empty');else em.innerHTML='<span data-lang="output_empty">'+t('output_empty')+'</span>'}saveCfg()};
loadCfg();updUI();SD.className='dot offline';SS.textContent=t('status_disconnected');CI.disabled=true;EB.disabled=true;const hh=document.querySelector('.command-toolbar .hint');if(hh)hh.textContent=t('hint_click');if(U.value&&PW.value)log(t('msg_config_loaded'),'info');else log(t('msg_config_prompt'),'info')
})();
